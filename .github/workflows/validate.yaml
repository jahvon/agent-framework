name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Needed for `claude plugin validate`; no API key is used.
      - run: npm install -g @anthropic-ai/claude-code
      - uses: flowexec/action@v1
        with:
          executable: validate
